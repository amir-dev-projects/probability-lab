name: Deploy LotteryLab to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/lotto-max/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PDF text extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Generate and validate Lotto Max datasets
        run: python3 scripts/build_lotto_max_data.py
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
      - name: Commit refreshed datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/lotto-max/draws.json public/data/lotto-max/maxmillions.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated Lotto Max historical datasets"
            git push
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
